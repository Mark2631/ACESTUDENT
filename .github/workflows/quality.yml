name: Ace Student quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/ace-*"

permissions:
  contents: read

concurrency:
  group: ace-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production app
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Preserve failing browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ace-browser-failures-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
